name: Build VisionADAS iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Compile App with Xcode
        run: |
          xcodebuild -project VisionADAS.xcodeproj \
            -scheme VisionADAS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/VisionADAS.app Payload/
          zip -r VisionADAS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionADAS-Unsigned-IPA
          path: VisionADAS.ipa